<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Genom</title>
<meta name="theme-color" content="#020804">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Libre+Franklin:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root { --black:#050704; --white:#fff; --acid:#c8ff00; --muted:#8e9387; --line:rgba(255,255,255,.14); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: radial-gradient(circle at 50% 18%, rgba(200,255,0,.1), transparent 42%), var(--black);
    color: var(--white); text-align: center; font: 15px/1.6 "Inter", Arial, sans-serif;
  }
  .box { width: min(760px, 100%); padding: 44px 24px; }
  .code {
    color: var(--white); font-family: Georgia, "Times New Roman", serif; font-weight: 700;
    font-size: clamp(112px, 24vw, 220px); line-height: .78; letter-spacing: -.07em;
  }
  .gene { margin-top: 42px; color: var(--acid); font: 11px/1.4 "JetBrains Mono", monospace; letter-spacing: .18em; }
  .caret { display: inline-block; width: 7px; height: 7px; margin-left: 9px; border-radius: 50%; background: var(--acid); }
  @media (prefers-reduced-motion:no-preference) { .caret { animation: blink 1.1s steps(1) infinite; } }
  @keyframes blink { 50% { opacity: 0; } }
  .note { margin-top: 14px; color: var(--muted); font-size: 16px; }
  .back {
    display: inline-flex; min-height: 48px; align-items: center; justify-content: center;
    margin-top: 34px; padding: 0 24px; border: 1px solid var(--acid); border-radius: 11px;
    background: var(--acid); color: var(--black); text-decoration: none; font-weight: 700;
  }
  .back:hover { background: #dcff55; }
  .back:focus-visible { outline: 2px solid var(--white); outline-offset: 4px; }
</style>
</head>
<body>
<div class="box">
  <p class="code">404</p>
  <p class="gene">GENE NOT FOUND<span class="caret"></span></p>
  <p class="note">This sequence does not exist in the genome.</p>
  <a class="back" href="/">Back to the genome</a>
</div>
</body>
</html>
