<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Genom — admin</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --black:#050704; --panel:#0a0d08; --white:#fff; --acid:#c8ff00; --muted:#8e9387; --line:rgba(255,255,255,.14); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: radial-gradient(circle at 50% 0, rgba(200,255,0,.09), transparent 38%), var(--black);
    color: var(--white); font: 15px/1.6 "Inter", Arial, sans-serif;
  }
  .box {
    width: min(560px, 100%); padding: 38px; border: 1px solid var(--line); border-radius: 20px;
    background: rgba(10,13,8,.9);
  }
  h1 {
    margin-bottom: 30px; color: var(--white); font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(38px, 8vw, 58px); line-height: 1; letter-spacing: -.04em;
  }
  h1::before { content: "PRIVATE CONTROL · "; display:block; margin-bottom:12px; color:var(--acid); font:10px/1.2 "JetBrains Mono",monospace; letter-spacing:.14em; }
  label { display: block; margin: 18px 0 7px; color: var(--muted); font: 10px/1.4 "JetBrains Mono", monospace; letter-spacing: .13em; }
  input {
    width: 100%; min-height: 46px; padding: 0 14px; border: 1px solid var(--line); border-radius: 11px;
    background: rgba(255,255,255,.025); color: var(--white); font: 13px "JetBrains Mono", monospace;
  }
  input:focus { outline: 2px solid var(--acid); outline-offset: 2px; }
  button {
    width: 100%; min-height: 48px; margin-top: 22px; border: 1px solid var(--acid); border-radius: 11px;
    background: var(--acid); color: var(--black); font: 700 13px "Inter", Arial, sans-serif; cursor: pointer;
  }
  button:hover { background: #dcff55; }
  .row { margin-top: 18px; color: var(--muted); font: 11px/1.6 "JetBrains Mono", monospace; word-break: break-all; }
  .row b { color: var(--white); font-weight: 500; }
  #status.ok { color: var(--acid); }
  #status.err { color: #ff654a; }
  @media (max-width:520px) { .box { padding: 28px 20px; border-radius: 16px; } }
</style>
</head>
<body>
<div class="box">
  <h1>GENOM ADMIN</h1>
  <label for="secret">ADMIN SECRET</label>
  <input id="secret" type="password" autocomplete="off">
  <label for="ca">CONTRACT ADDRESS (CA)</label>
  <input id="ca" type="text" autocomplete="off" spellcheck="false" maxlength="80">
  <button id="apply" type="button">APPLY</button>
  <p class="row">current: <b id="current">—</b></p>
  <p class="row" id="status"></p>
</div>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  try { $("secret").value = localStorage.getItem("genomAdminSecret") || ""; } catch (e) {}
  function refresh() {
    fetch("/api/ca").then(function (r) { return r.json(); })
      .then(function (d) { $("current").textContent = (d && d.ca) || "—"; })
      .catch(function () { $("current").textContent = "—"; });
  }
  $("apply").addEventListener("click", function () {
    var secret = $("secret").value, ca = $("ca").value;
    try { localStorage.setItem("genomAdminSecret", secret); } catch (e) {}
    var st = $("status");
    st.className = "";
    st.textContent = "applying…";
    fetch("/api/admin", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ secret: secret, ca: ca })
    }).then(function (r) {
      return r.json().then(function (d) { return { s: r.status, d: d }; });
    }).then(function (x) {
      if (x.d && x.d.ok) { st.className = "ok"; st.textContent = "applied: " + (x.d.ca || "(cleared)"); }
      else { st.className = "err"; st.textContent = "error " + x.s + ": " + ((x.d && x.d.error) || ""); }
      refresh();
    }).catch(function () { st.className = "err"; st.textContent = "network error"; });
  });
  refresh();
})();
</script>
</body>
</html>
